name: SmartSure CI/CD

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build-java-services:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [
          'APIGatewayApplication',
          'AdminDashboardService',
          'AuthenticationServiceApplication',
          'ClaimsServiceApplication',
          'ConfigServerApplication',
          'DiscoveryServer',
          'NoficationServiceApplication',
          'PolicyServiceApplication'
        ]
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: maven

    - name: Build with Maven
      run: |
        cd ${{ matrix.service }}
        mvn clean package -DskipTests

  build-frontend:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: Frontend_/package-lock.json

    - name: Install dependencies
      run: |
        cd Frontend_
        npm install

    - name: Build Frontend
      run: |
        cd Frontend_
        npm run build

  docker-build:
    needs: [build-java-services, build-frontend]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    steps:
    - uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    # Note: To enable pushing to a registry, you must add DOCKER_USERNAME and DOCKER_PASSWORD to GitHub Secrets
    - name: Login to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Build Services (Docker Compose)
      run: |
        docker-compose build
