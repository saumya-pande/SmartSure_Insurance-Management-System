server:
  port: 8080

eureka:
  instance:
    hostname: localhost
    prefer-ip-address: false
  client:
    fetch-registry: true
    register-with-eureka: true
    service-url:
      defaultZone: http://localhost:8761/eureka/

jwt:
  secret: 404E635HatsuneNMiki82F413F4428472B4B6250645367566B5970

spring:
  cloud:
    gateway:
      server:
        webflux:
          discovery:
            locator:
              enabled: true
              lower-case-service-id: true
          routes:
            - id: auth-service
              uri: lb://auth-service
              predicates:
                - Path=/api/auth/**
            - id: policy-service
              uri: lb://policy-service
              predicates:
                - Path=/api/policies/**
              filters:
                - Authentication
            - id: claims-service
              uri: lb://claims-service
              predicates:
                - Path=/api/claims/**
              filters:
                - Authentication
            - id: admin-service
              uri: lb://admin-service
              predicates:
                - Path=/api/admin/**
              filters:
                - Authentication
